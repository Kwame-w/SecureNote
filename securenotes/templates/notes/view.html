{% extends "base.html" %}
{% block title %}{{ note.title }}{% endblock %}
{% block content %}
<article class="card">
  <h1>{{ note.title }}</h1>
  {# Autoescaped by Jinja: any HTML or <script> in a note is shown as text, never run. #}
  <div class="body">{{ note.body }}</div>
  <div class="row actions">
    <a class="button" href="{{ url_for('notes.edit', note_id=note.id) }}">Edit</a>
    <form method="post" action="{{ url_for('notes.delete', note_id=note.id) }}" class="inline">
      {{ delete_form.hidden_tag() }}
      <button class="danger">Delete</button>
    </form>
  </div>
</article>
<p><a href="{{ url_for('notes.index') }}">&larr; All notes</a></p>
{% endblock %}
