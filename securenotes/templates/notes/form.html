{% extends "base.html" %}
{% from "_field.html" import field %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<section class="card">
  <h1>{{ heading }}</h1>
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    {{ field(form.title) }}
    {{ field(form.body) }}
    <button class="primary">Save</button>
  </form>
</section>
{% endblock %}
