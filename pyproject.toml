[project]
name = "securenotes"
version = "1.0.0"
description = "A small Flask notes app hardened against the OWASP Top 10, with a DevSecOps CI pipeline."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and test passwords are fine in tests

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
