name: CI / Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch newly disclosed CVEs in pinned dependencies

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit semgrep
      - name: Bandit
        run: bandit -c pyproject.toml -r securenotes
      - name: Semgrep (Python, Flask, OWASP Top 10 rules)
        run: semgrep scan --config p/python --config p/flask --config p/owasp-top-ten --error --metrics=off securenotes

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t securenotes:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0, pinned to a commit SHA
        with:
          image-ref: securenotes:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Report findings
        # Each fixable HIGH/CRITICAL finding becomes an annotation on the run, and the job fails if there are any.
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("trivy.json"))
          found = [(r.get("Target", ""), v) for r in data.get("Results", []) for v in r.get("Vulnerabilities") or []]
          for target, v in found:
              print(f"::error title={v['VulnerabilityID']} ({v['Severity']})::{v['PkgName']} {v['InstalledVersion']} -> fix {v.get('FixedVersion', '?')} in {target}")
          print(f"{len(found)} fixable HIGH/CRITICAL vulnerabilities")
          sys.exit(1 if found else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy.json
