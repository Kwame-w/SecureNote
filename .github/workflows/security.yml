name: CI / Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch newly disclosed CVEs in pinned dependencies

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit semgrep
      - name: Bandit
        run: bandit -c pyproject.toml -r securenotes
      - name: Semgrep (Python, Flask, OWASP Top 10 rules)
        run: semgrep scan --config p/python --config p/flask --config p/owasp-top-ten --error --metrics=off securenotes

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t securenotes:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: securenotes:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
